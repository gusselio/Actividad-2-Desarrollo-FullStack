<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Fullstack - Artoon App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Gestor de Tareas</h1>
      <p>Organizador interactivo con ES6+ y POO</p>
    </header>

    <!-- Formulario para agregar tareas -->
    <div class="task-form">
      <input type="text" id="taskInput" placeholder="¿Qué tarea deseas agregar hoy?" autocomplete="off">
      <button id="addTaskBtn" class="btn-add">Agregar Tarea</button>
    </div>
    <div id="errorMsg" class="error-message"></div>

    <!-- Lista donde se renderizarán las tareas dinámicamente -->
    <ul id="taskList" class="task-list">
      <!-- Las tareas se insertarán aquí por JavaScript -->
    </ul>
  </div>

  <!-- Enlace al archivo JavaScript -->
  <script src="app.js"></script>
</body>
</html>
